# Plainsight behind nginx. The app listens on 127.0.0.1:8100 only, so nginx is the one way in.
#
# This is the file as first installed, before HTTPS. The live copy is
# /etc/nginx/sites-available/plainsight on the server, where certbot added the HTTPS (port 443)
# lines and the http -> https redirect. Deploys never touch it. If you change this file,
# make the same change on the server, then: sudo nginx -t && sudo systemctl reload nginx
#
# Jhola's and QuoteRunner's sites live on the same nginx. The names below all start with
# "plainsight" so they can't clash with theirs.

# Backstop limits. The app's own limits (RATE_LIMIT_PER_HOUR per visitor, DAILY_QUESTION_CAP for
# the site) are what cap OpenAI spend; these only stop one address hammering the server.
# Normal use never gets near them.
limit_req_zone $binary_remote_addr zone=plainsight_ask:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=plainsight_pages:10m rate=120r/m;

upstream plainsight_app {
    server 127.0.0.1:8100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name plainsight.ramiyer.tech;

    # A question is at most 300 characters.
    client_max_body_size 16k;

    # Set here once, inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The app rate-limits by X-Real-IP. Both are overwritten with the real client address,
    # so a visitor can't fake them to get around the limits.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A question with a second attempt can take half a minute.
    proxy_read_timeout 70s;
    limit_req_status 429;

    location = /api/ask {
        limit_req zone=plainsight_ask burst=10 nodelay;
        proxy_pass http://plainsight_app;
    }

    # CSS, JavaScript and the icon. Their links carry a version number that changes when the
    # file does, so browsers can keep them for a week.
    location /static/ {
        expires 7d;
        proxy_pass http://plainsight_app;
    }

    location / {
        limit_req zone=plainsight_pages burst=60 nodelay;
        proxy_pass http://plainsight_app;
    }
}
