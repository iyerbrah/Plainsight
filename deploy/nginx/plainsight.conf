# Plainsight behind nginx. Streamlit listens on 127.0.0.1:8501 only, so nginx is the one way in.
#
# This is the file as first installed, before HTTPS. The live copy is
# /etc/nginx/sites-available/plainsight on the server, where certbot added the HTTPS (port 443)
# lines and the http -> https redirect. Deploys never touch it. If you change this file,
# make the same change on the server, then: sudo nginx -t && sudo systemctl reload nginx
#
# Jhola's site lives on the same nginx. The names below all start with "plainsight" so they
# can't clash with Jhola's.

# Streamlit runs each browser tab over one WebSocket on /_stcore/stream. This turns the
# browser's "Upgrade: websocket" request into the Connection header the socket needs, and
# leaves it empty for ordinary requests so they can reuse connections to the app.
map $http_upgrade $plainsight_connection {
    default upgrade;
    ''      '';
}

# Backstop limits. Questions travel inside the WebSocket, so nginx can't count them: the app's
# own per-visitor limits (RATE_LIMIT_PER_HOUR, DAILY_QUESTION_CAP) are what cap OpenAI spend.
# These only stop one address opening sessions or fetching pages far faster than a person can.
# A first visit loads a few dozen files at once, which the bursts cover.
limit_req_zone $binary_remote_addr zone=plainsight_stream:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=plainsight_pages:10m rate=300r/m;

upstream plainsight_app {
    server 127.0.0.1:8501;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name plainsight.ramiyer.tech;

    # The app takes no uploads.
    client_max_body_size 1m;

    # Set here once, inherited by both locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The app rate-limits by X-Real-IP. Both are overwritten with the real client address,
    # so a visitor can't fake them to get around the limits.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $plainsight_connection;
    limit_req_status 429;

    # The WebSocket. Without the Upgrade and Connection headers above, the page sits on
    # "Connecting" forever. It stays open while the tab is open, so the timeouts are long.
    location = /_stcore/stream {
        limit_req zone=plainsight_stream burst=20 nodelay;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://plainsight_app;
    }

    location / {
        limit_req zone=plainsight_pages burst=200 nodelay;
        proxy_pass http://plainsight_app;
    }
}
