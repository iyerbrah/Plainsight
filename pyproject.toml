[project]
name = "plainsight"
version = "1.0.0"
description = "Ask business questions in plain English, get checked, read-only SQL answers, and measure how often they are right."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ram Iyer" }]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://plainsight.ramiyer.tech"
Source = "https://github.com/iyerbrah/Plainsight"
Scorecard = "https://plainsight.ramiyer.tech/scorecard"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
